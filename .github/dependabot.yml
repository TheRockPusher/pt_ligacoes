version: 2
# uv 0.12 and pnpm 12 exceed documented hosted updater support. Application
# lockfiles receive CI audits and reviewed maintainer updates, not unsupported jobs.
updates:
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: deps
    groups:
      container-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    groups:
      database-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      action-compatible:
        patterns: ["*"]
        update-types: [minor, patch]

name: pt-ligacoes
services:
  postgres:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: pt_ligacoes
      POSTGRES_USER: pt_ligacoes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env before starting local PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-e2e.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pt_ligacoes -d pt_ligacoes"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres-data:

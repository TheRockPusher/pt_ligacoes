name: pt-ligacoes
services:
  postgres:
    image: postgres:18-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: pt_ligacoes
      POSTGRES_USER: pt_ligacoes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make env before starting local PostgreSQL}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-e2e.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pt_ligacoes -d pt_ligacoes"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres-data:
